name: autobahn tests

on:
  push:
    branches:
      - mistress
  pull_request:

jobs:
  autobahn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          gleam-version: "1.14.0"
          rebar3-version: "3"

      - name: Downloading dependencies
        run: gleam deps download

      - name: Start Autobahn server
        run: |
          docker run --rm \
            -v "${PWD}/autobahn/config.json:/autobahn.json" \
            -v "${PWD}/autobahn:/reports" \
            --network host \
            -d \
            --name autobahn-server \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingserver -s /autobahn.json

      - name: Wait for Autobahn server to start
        run: sleep 5

      - name: Run WebSocket client tests
        run: gleam run -m autobahn

      - name: Stop Autobahn server
        if: always()
        run: docker stop autobahn-server || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: autobahn/clients/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/mistress'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./autobahn/clients
          destination_dir: autobahn
