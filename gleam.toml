name = "collie"
version = "1.0.0"
licences = ["Apache-2.0"]
description = "Websocket client in Gleam based on websocks"
target = "erlang"
repository = { type = "github", user = "vshakitskiy", repo = "collie" }

[erlang]
extra_applications = ["ssl"]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
websocks = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
exception = ">= 2.1.0 and < 3.0.0"
logging = ">= 1.3.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
stratus = ">= 2.0.0 and < 3.0.0"
